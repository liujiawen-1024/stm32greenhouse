# openocd/stm32f103_stlink.cfg
# 供 CLion 的 "OpenOCD Download & Run" / Debug Servers 使用的合并板级配置。
# 说明：CLion 只向 openocd 传一个 -f <board config>，所以 interface 与 target 必须写在同一文件里。
# 由 CubeMX 生成的代码不会被本文件影响（本文件在工程根目录的 openocd\ 子目录中）。

# 1) 调试探针：ST-LINK（SWD 传输）
source [find interface/stlink.cfg]

# 2) 芯片：STM32F1 系列
source [find target/stm32f1x.cfg]

# 3) 适配速度（kHz）：默认 2000，若连接受干扰可降低为 1000/500
adapter speed 2000
